<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Spanish A1 — Complete CEFR Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--panel:#fff;--ink:#1e1e1e;--sub:#777;--muted:#aaa;
  --accent:#b5342b;--accent-l:#fbe4e2;--accent-d:#7a2019;
  --border:#e4e0da;--card:#fafaf8;--phrase-bg:#fdeeee;
  --warn:#b5651d;--warn-bg:#fff4e6;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.07);
}
body.dark{
  --bg:#1a1615;--panel:#241d1c;--ink:#ede6e4;--sub:#a89b98;--muted:#6b625f;
  --accent:#e0776e;--accent-l:#3a2320;--accent-d:#f0a49d;
  --border:#3a2f2c;--card:#2a2220;--phrase-bg:#2e211f;
  --warn:#d99456;--warn-bg:#332a1c;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;transition:background .15s,color .15s}
a{color:var(--accent);text-decoration:none}
.top-bar{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:100}
.top-bar button{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.home-link{width:auto;padding:0 12px;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)!important;text-decoration:none!important}

.shell{display:flex;height:100dvh;overflow:hidden}
.nav{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.nav-head{padding:20px 20px 14px;border-bottom:1px solid var(--border)}
.nav-head h1{font-size:16px;font-weight:700;color:var(--accent-d)}
.nav-head .sub{font-size:11.5px;color:var(--sub);margin-top:2px}
.progress-wrap{margin-top:10px}
.progress-bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-bar>div{height:100%;background:var(--accent);transition:width .3s}
.progress-label{font-size:11px;color:var(--sub);margin-top:4px}
.nav-list{overflow-y:auto;flex:1;padding:6px 0}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 20px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:background .12s}
.nav-item:hover{background:var(--accent-l)}
.nav-item.active{background:var(--accent-l);border-left-color:var(--accent);font-weight:600;color:var(--accent-d)}
.nav-item .num{font-size:11px;color:var(--muted);width:22px;flex-shrink:0}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .badge{font-size:10px;color:var(--sub);flex-shrink:0}

.main{flex:1;overflow-y:auto;padding:32px 40px 60px}
.ch-head{margin-bottom:24px}
.ch-num{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ch-title{font-size:24px;font-weight:700;margin-top:2px}
.ch-es{font-size:14px;color:var(--sub);margin-top:2px;font-style:italic}
.ch-count{font-size:12px;color:var(--sub);margin-top:6px}

.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.toolbar button{border:1px solid var(--border);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;transition:border-color .15s}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;flex-direction:column;gap:4px;position:relative;transition:border-color .15s,opacity .15s}
.card.learned{border-color:var(--accent);background:var(--accent-l);opacity:.75}
.card-row{display:flex;align-items:center;gap:10px}
.card .es{font-weight:700;font-size:15px;flex:1}
.speak{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
.speak:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.learn-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
.learn-btn:hover,.learn-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card .en{font-size:13.5px;color:var(--sub)}
.card .en.blur{filter:blur(5px);cursor:pointer;user-select:none}
.card .ex{font-size:12px;color:var(--muted);font-style:italic;border-top:1px dashed var(--border);padding-top:5px;margin-top:3px}

.phrases-section{margin-top:32px;border-top:2px solid var(--accent);padding-top:20px}
.phrases-section h3{font-size:15px;font-weight:700;color:var(--accent-d);margin-bottom:12px}
.phrase{background:var(--phrase-bg);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start}
.phrase .p-es{font-weight:600;font-size:14px;flex:1}
.phrase .p-en{font-size:13px;color:var(--sub);flex:1}
.phrase .p-speak{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phrase .p-speak:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{background:var(--warn-bg);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:6px;font-size:13px;color:var(--ink)}

@media(max-width:768px){
  .nav{display:none}
  .main{padding:16px}
  .cards{grid-template-columns:1fr}
  .mob-toggle{display:block!important}
  .nav.open{display:flex;position:fixed;top:0;left:0;width:80%;height:100dvh;z-index:99;box-shadow:4px 0 20px rgba(0,0,0,.2)}
}
.mob-toggle{display:none;position:fixed;bottom:16px;left:16px;z-index:100;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
</style>
</head>

  {"es": "de ... a ...", "en": "from ... to/until", "ex": "Tenemos clase de 8 a 12."},
  {"es": "tarde", "en": "late", "ex": "Ya es tarde."},
  {"es": "puntual", "en": "punctual / on time", "ex": "El camión sale puntual a las ocho."},
  {"es": "durar", "en": "to last / take (time)", "ex": "¿Cuánto dura la película?"},
  {"es": "el tiempo", "en": "time", "ex": "Hoy no tengo tiempo."},
  {"es": "la pausa", "en": "break / pause", "ex": "Vamos a hacer una pausa."},
  {"es": "un momento", "en": "a moment", "ex": "Un momento, por favor."},
  {"es": "enseguida", "en": "right away", "ex": "Voy enseguida."},
  {"es": "ya", "en": "already", "ex": "¿Ya está listo?"},
  {"es": "todavía", "en": "still / yet", "ex": "Todavía tengo veinte pesos."},
  {"es": "desde", "en": "since / for", "ex": "Vivo aquí desde hace tres años."}
], "phrases": [
  {"es": "¿Qué hora es?", "en": "What time is it?"},
  {"es": "Son las tres.", "en": "It's three o'clock."},
  {"es": "Son las tres y media. (= 3:30)", "en": "It's half past three."},
  {"es": "Son las cinco y cuarto. (= 5:15)", "en": "It's quarter past five."},
  {"es": "Son las ocho menos cuarto. (= 7:45)", "en": "It's quarter to eight."},
  {"es": "¿A qué hora empieza el curso? — A las nueve.", "en": "When does the course start? — At nine o'clock."},
  {"es": "¿Cuánto dura la película? — Dos horas.", "en": "How long does the film last? — Two hours."},
  {"es": "NOTE: Spanish clock time is refreshingly literal compared to German — 'y media' just means 'and a half' PAST the stated hour. No counting-toward-the-next-hour trick.", "en": ""}
]}
];

let learned = {};
let quiz = false;
let cur = 0;

async function loadState(){
  try{
    const raw=localStorage.getItem('es-a1-v1');
    learned=raw?JSON.parse(raw):{};
  }catch(e){learned={};}
}
async function saveState(){
  try{localStorage.setItem('es-a1-v1',JSON.stringify(learned));}catch(e){}
}

function initMode(){
  const saved=localStorage.getItem('es-a1-dark');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  setMode(saved!==null?saved==='1':prefersDark);
}
function setMode(dark){
  document.body.classList.toggle('dark',dark);
  document.getElementById('modeBtn').textContent=dark?'☀️':'🌙';
  try{localStorage.setItem('es-a1-dark',dark?'1':'0');}catch(e){}
}
document.getElementById('modeBtn').onclick=()=>setMode(!document.body.classList.contains('dark'));
initMode();

function wid(ci,wi){return ci+'-'+wi;}
function countLearned(ci){return DATA[ci].words.filter((_,wi)=>learned[wid(ci,wi)]).length;}
function totalLearned(){return DATA.reduce((s,_,ci)=>s+countLearned(ci),0);}
function totalWords(){return DATA.reduce((s,c)=>s+c.words.length,0);}

function speak(text){
  if(!('speechSynthesis' in window))return;
  // Spanish entries can also pack alternatives, e.g. "el/la extranjero/a".
  // Strip a leading article (el/la/los/las) from each "/" piece and read all of them.
  const parts=text.split('/')
    .map(p=>p.replace(/\(.*?\)/g,'').trim())
    .map(p=>p.replace(/^(el|la|los|las)\s+/i,'').trim())
    .filter(Boolean);
  const clean=parts.join(', ');
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='es-MX';u.rate=0.88;
  window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
}

function renderNav(){
  const el=document.getElementById('navList');
  el.innerHTML='';
  DATA.forEach((c,i)=>{
    const n=countLearned(i),t=c.words.length;
    const d=document.createElement('div');
    d.className='nav-item'+(i===cur?' active':'');
    d.innerHTML=`<span class="num">${c.num}.</span><span class="label">${c.en}</span><span class="badge">${n}/${t}</span>`;
    d.onclick=()=>{cur=i;render();document.getElementById('nav').classList.remove('open');};
    el.appendChild(d);
  });
  const tl=totalLearned(),tw=totalWords();
  document.getElementById('plabel').textContent=`${tl} / ${tw} words learned`;
  document.getElementById('pbar').style.width=(100*tl/tw)+'%';
}

function renderMain(){
  const c=DATA[cur];
  const m=document.getElementById('main');
  let h=`<div class="ch-head">
    <div class="ch-num">Chapter ${c.num}</div>
    <div class="ch-title">${c.en}</div>
    <div class="ch-es">${c.es}</div>
    <div class="ch-count">${c.words.length} words · ${countLearned(cur)} learned</div>
  </div>
  <div class="toolbar">
    <button id="quizBtn" class="${quiz?'on':''}" title="Hide English translations — click a card to reveal">🔒 Quiz mode</button>
    <button id="speakAll" title="Hear all words in this chapter">🔊 Play all</button>
    <button id="learnAll" title="Mark every word in this chapter as learned">✓ Mark all learned</button>
    <button id="unlearnAll" title="Reset progress for this chapter">↺ Reset chapter</button>
  </div>
  <div class="cards">`;

  c.words.forEach((w,wi)=>{
    const id=wid(cur,wi);
    const done=learned[id];
    h+=`<div class="card${done?' learned':''}" data-wi="${wi}">
      <div class="card-row">
        <div class="es">${esc(w.es)}</div>
        <button class="speak" data-es="${esc(w.es)}" title="Hear pronunciation">🔊</button>
        <button class="learn-btn${done?' on':''}" data-wi="${wi}" title="${done?'Learned ✓ — click to unmark':'Mark as learned'}">✓</button>
      </div>
      <div class="en${quiz&&!done?' blur':''}" data-wi="${wi}">${esc(w.en)}</div>
      ${w.ex?`<div class="ex">${esc(w.ex)}</div>`:''}
    </div>`;
  });
  h+=`</div>`;

  if(c.phrases.length){
    h+=`<div class="phrases-section"><h3>💬 Common Phrases & Sentences</h3>`;
    c.phrases.forEach(p=>{
      if(p.es.startsWith('NOTE:')){
        h+=`<div class="note">📝 ${esc(p.es.slice(5).trim())}</div>`;
      } else {
        h+=`<div class="phrase">
          <button class="p-speak" data-es="${esc(p.es)}" title="Hear">🔊</button>
          <div class="p-es">${esc(p.es)}</div>
          <div class="p-en">${esc(p.en)}</div>
        </div>`;
      }
    });
    h+=`</div>`;
  }

  m.innerHTML=h;
  m.scrollTop=0;

  m.querySelectorAll('.speak,.p-speak').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();speak(e.currentTarget.dataset.es);}));
  m.querySelectorAll('.learn-btn').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const wi=+e.currentTarget.dataset.wi;const id=wid(cur,wi);
    learned[id]=!learned[id];saveState();render();
  }));
  m.querySelectorAll('.en.blur').forEach(el=>el.addEventListener('click',()=>el.classList.remove('blur')));
  document.getElementById('quizBtn').onclick=()=>{quiz=!quiz;renderMain();};
  document.getElementById('speakAll').onclick=()=>{
    const ws=c.words;let i=0;
    function next(){if(i>=ws.length)return;speak(ws[i].es);i++;setTimeout(next,1800);}
    next();
  };
  document.getElementById('learnAll').onclick=()=>{c.words.forEach((_,wi)=>learned[wid(cur,wi)]=true);saveState();render();};
  document.getElementById('unlearnAll').onclick=()=>{c.words.forEach((_,wi)=>delete learned[wid(cur,wi)]);saveState();render();};
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){renderNav();renderMain();}

document.getElementById('mobBtn').onclick=()=>document.getElementById('nav').classList.toggle('open');

(async()=>{await loadState();render();})();
</script>
</body>
</html>
