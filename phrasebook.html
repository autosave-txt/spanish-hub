<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Self-Introduction Phrasebook — Spanish Learning Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ef;--panel:#fff;--ink:#1e1e1e;--sub:#777;--muted:#aaa;
  --accent:#b5342b;--accent-l:#fbe4e2;--accent-d:#7a2019;
  --border:#e4e0da;--card:#fafaf8;
  --formal:#2d5a8c;--formal-l:#e2edf7;
  --warn:#b5651d;--warn-bg:#fff4e6;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.07);
}
body.dark{
  --bg:#1a1615;--panel:#241d1c;--ink:#ede6e4;--sub:#a89b98;--muted:#6b625f;
  --accent:#e0776e;--accent-l:#3a2320;--accent-d:#f0a49d;
  --border:#3a2f2c;--card:#2a2220;
  --formal:#6fa3d8;--formal-l:#1e2c3a;
  --warn:#d99456;--warn-bg:#332a1c;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;transition:background .15s,color .15s}
a{color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
.top-bar{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:10}
.top-bar button,.top-bar a{height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.top-bar a{width:auto;border-radius:99px;padding:0 14px;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none}
.mode-toggle{width:38px}

.top h1{font-size:22px;font-weight:700;color:var(--accent-d)}
.top .sub{font-size:13px;color:var(--sub);margin-top:4px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--panel);border:1px solid var(--border);border-radius:99px;padding:6px 12px;margin-top:12px}

.legend{display:flex;gap:10px;margin:18px 0 26px;flex-wrap:wrap}
.legend .chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px}
.chip.du{background:var(--accent-l);color:var(--accent-d)}
.chip.sie{background:var(--formal-l);color:var(--formal)}

.section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.section h2{font-size:15.5px;font-weight:700;color:var(--accent-d);margin-bottom:2px}

.qa-block{display:flex;gap:12px;margin-bottom:12px}
.qa-block:last-of-type{margin-bottom:0}
.qa-label{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:2px}
.qa-label.q{background:var(--warn-bg);color:var(--warn)}
.qa-label.a{background:var(--accent-l);color:var(--accent-d)}
.qa-rows{flex:1;border-left:2px solid var(--border);padding-left:12px}

.variant-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.variant-row:last-child{margin-bottom:0}
.tag{flex-shrink:0;width:40px;text-align:center;font-size:10px;font-weight:700;padding:3px 0;border-radius:5px}
.tag.du{background:var(--accent-l);color:var(--accent-d)}
.tag.sie{background:var(--formal-l);color:var(--formal)}
.phrase-block{flex:1;background:var(--card);border-radius:6px;padding:7px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phrase-block .es{font-weight:600;font-size:14px}
.phrase-block .en{font-size:12px;color:var(--sub);width:100%}
.speak{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto}
.speak:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.note{background:var(--warn-bg);border-left:3px solid var(--warn);padding:9px 13px;border-radius:0 6px 6px 0;font-size:12.5px;margin-top:12px}
.grammar{background:var(--formal-l);border-left:3px solid var(--formal);padding:9px 13px;border-radius:0 6px 6px 0;font-size:12.5px;margin-top:12px}
.grammar b{color:var(--formal)}

.gw{border-bottom:1px dotted var(--sub);cursor:help}
#glossTip{position:fixed;background:rgba(20,20,20,.94);color:#fff;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s ease;z-index:1000}
#glossTip.show{opacity:1}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" title="Back to home">🏠 Home</a>
  <button class="mode-toggle" id="modeBtn" title="Toggle dark mode">🌙</button>
</div>
<div class="wrap">
  <div class="top">
    <h1>Self-Introduction Phrasebook</h1>
    <div class="sub">Real Q&A patterns — greetings, origin, residence, languages — in both tú (informal) and usted (formal).</div>
  </div>

  <div class="legend">
    <span class="chip du">TÚ — informal</span>
    <span class="chip sie">USTED — formal</span>
  </div>

  <div id="sections"></div>
</div>

<script>
const SECTIONS = [
  {
    title:"Name",
    q:[{du:"¿Cómo te llamas?", sie:"¿Cómo se llama usted?", en:"What is your name?", duW:["How","yourself","you call"], sieW:["How","yourself","call","you (formal)"]}],
    a:[{du:"Me llamo ___.", sie:"Me llamo ___. / Mi nombre es ___.", en:"My name is ___.", duW:["Myself","I call"], sieW:["Myself","I call"]}],
    grammar:"llamarse is reflexive — literally \"to call oneself.\" Me llamo = \"I call myself,\" not a separate verb for \"to be named.\""
  },
  {
    title:"Where you're from",
    q:[{du:"¿De dónde eres?", sie:"¿De dónde es usted?", en:"Where are you from?", duW:["From","where","are"], sieW:["From","where","are","you (formal)"]}],
    a:[{du:"Soy de ___.", sie:"Soy de ___.", en:"I am from ___.", duW:["I am","from"], sieW:["I am","from"]}],
    grammar:"This uses ser (permanent/origin \"to be\"), not estar. Origin is a lasting fact about you, which is exactly what ser is for."
  },
  {
    title:"Where you live",
    q:[{du:"¿Dónde vives?", sie:"¿Dónde vive usted?", en:"Where do you live?", duW:["Where","live"], sieW:["Where","live","you (formal)"]}],
    a:[{du:"Vivo en ___.", sie:"Vivo en ___.", en:"I live in ___.", duW:["I live","in"], sieW:["I live","in"]}]
  },
  {
    title:"Languages",
    q:[{du:"¿Qué idiomas hablas?", sie:"¿Qué idiomas habla usted?", en:"What languages do you speak?", duW:["What","languages","speak"], sieW:["What","languages","speaks","you (formal)"]}],
    a:[{du:"Hablo español / inglés / un poco de ___.", sie:"Hablo español / inglés / un poco de ___.", en:"I speak Spanish / English / a little ___.", duW:["I speak","Spanish"], sieW:["I speak","Spanish"]}]
  },
  {
    title:"Nice to meet you",
    q:[],
    a:[{du:"¡Mucho gusto! / ¡Un placer!", sie:"¡Mucho gusto! / ¡Un placer!", en:"Nice to meet you!", duW:["Much","pleasure"], sieW:["Much","pleasure"]}],
    note:"Same phrase either way — mucho gusto works fine in both registers, formal or casual."
  },
  {
    title:"How are you",
    q:[{du:"¿Cómo estás?", sie:"¿Cómo está usted?", en:"How are you?", duW:["How","are (estar)"], sieW:["How","is (estar)","you (formal)"]}],
    a:[{du:"Estoy bien, gracias.", sie:"Estoy bien, gracias.", en:"I'm fine, thank you.", duW:["I am (estar)","well",",","thanks"], sieW:["I am (estar)","well",",","thanks"]}],
    grammar:"This uses estar, not ser — how you're FEELING right now is a temporary state, which is exactly what estar is for. Compare ¿Cómo eres? (ser) which would ask what you're like as a person, not how you're doing today."
  },
  {
    title:"Wishing someone well",
    q:[],
    a:[
      {du:"¡Buen provecho!", sie:"¡Buen provecho!", en:"Enjoy your meal!", duW:["Good","benefit"], sieW:["Good","benefit"]},
      {du:"¡Buena suerte!", sie:"¡Buena suerte!", en:"Good luck!", duW:["Good","luck"], sieW:["Good","luck"]},
      {du:"¡Que te vaya bien!", sie:"¡Que le vaya bien!", en:"All the best!", duW:["That","to you","go","well"], sieW:["That","to you (formal)","go","well"]}
    ]
  },
  {
    title:"Farewells",
    q:[],
    a:[
      {du:"¡Adiós!", sie:"¡Adiós!", en:"Goodbye!", duW:["Goodbye"], sieW:["Goodbye"]},
      {du:"¡Hasta luego!", sie:"¡Hasta luego!", en:"See you later!", duW:["Until","later"], sieW:["Until","later"]},
      {du:"¡Nos vemos!", sie:"¡Nos vemos!", en:"See you!", duW:["Us","we see"], sieW:["Us","we see"]}
    ],
    note:"All work in either register — Spanish farewells don't shift much between tú and usted the way questions do."
  }
];

function speak(text){
  if(!('speechSynthesis' in window))return;
  const clean=text.replace(/\s*\(.*?\)\s*/g,' ').replace(/\s*\/\s*/g,', ').replace(/\s{2,}/g,' ').trim();
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='es-MX';u.rate=0.88;
  window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function glossHTML(es, words){
  if(!words) return esc(es);
  const tokens = es.split(' ');
  return tokens.map((tok,i)=>{
    const m = tok.match(/^([¿¡]*)([^\s.,!?;:()"'’]+)([.,!?;:()"'’]*)$/);
    if(!m||words[i]===undefined) return esc(tok);
    const lead=m[1]||'', word=m[2], trail=m[3]||'';
    return `${esc(lead)}<span class="gw" data-tip="${esc(words[i])}">${esc(word)}</span>${esc(trail)}`;
  }).join(' ');
}

function renderVariantRows(item){
  let r=`<div class="variant-row">
    <span class="tag du">TÚ</span>
    <div class="phrase-block">
      <div class="es">${glossHTML(item.du, item.duW)}</div>
      <button class="speak" data-es="${esc(item.du)}" title="Hear (tú)">🔊</button>
      <div class="en">${esc(item.en)}</div>
    </div>
  </div>`;
  if(item.sie!==item.du){
    r+=`<div class="variant-row">
      <span class="tag sie">USTED</span>
      <div class="phrase-block">
        <div class="es">${glossHTML(item.sie, item.sieW)}</div>
        <button class="speak" data-es="${esc(item.sie)}" title="Hear (usted)">🔊</button>
        <div class="en">${esc(item.en)}</div>
      </div>
    </div>`;
  }
  return r;
}

function render(){
  const el=document.getElementById('sections');
  let h='';
  SECTIONS.forEach(sec=>{
    h+=`<div class="section"><h2>${esc(sec.title)}</h2>`;
    if(sec.q.length){
      h+=`<div class="qa-block">
        <span class="qa-label q">Q</span>
        <div class="qa-rows">${sec.q.map(renderVariantRows).join('')}</div>
      </div>`;
    }
    h+=`<div class="qa-block">
      <span class="qa-label a">A</span>
      <div class="qa-rows">${sec.a.map(renderVariantRows).join('')}</div>
    </div>`;
    if(sec.grammar) h+=`<div class="grammar"><b>Grammar:</b> ${esc(sec.grammar)}</div>`;
    if(sec.note) h+=`<div class="note">📝 ${esc(sec.note)}</div>`;
    h+=`</div>`;
  });
  el.innerHTML=h;
  el.querySelectorAll('.speak').forEach(b=>b.addEventListener('click',e=>speak(e.currentTarget.dataset.es)));
}
render();

function initMode(){
  const saved=localStorage.getItem('es-a1-dark');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  setMode(saved!==null?saved==='1':prefersDark);
}
function setMode(dark){
  document.body.classList.toggle('dark',dark);
  document.getElementById('modeBtn').textContent=dark?'☀️':'🌙';
  try{localStorage.setItem('es-a1-dark',dark?'1':'0');}catch(e){}
}
document.getElementById('modeBtn').onclick=()=>setMode(!document.body.classList.contains('dark'));
initMode();

(function(){
  let tipEl, timer, autoHideTimer;
  function ensureTip(){
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.id='glossTip'; document.body.appendChild(tipEl); }
    return tipEl;
  }
  function showTip(target){
    const tip=ensureTip();
    tip.textContent=target.dataset.tip;
    tip.classList.add('show');
    const r=target.getBoundingClientRect();
    tip.style.left=Math.min(Math.max(r.left+r.width/2,60),window.innerWidth-60)+'px';
    tip.style.top=Math.max(r.top-10,10)+'px';
    tip.style.transform='translate(-50%,-100%)';
    clearTimeout(autoHideTimer);
    autoHideTimer=setTimeout(hideTip,5000);
  }
  function hideTip(){ clearTimeout(timer); clearTimeout(autoHideTimer); ensureTip().classList.remove('show'); }
  document.addEventListener('mouseover',e=>{
    const g=e.target.closest('.gw'); if(!g)return;
    clearTimeout(timer); timer=setTimeout(()=>showTip(g),500);
  });
  document.addEventListener('mouseout',e=>{ if(e.target.closest('.gw')) hideTip(); });
  document.addEventListener('click',e=>{
    const g=e.target.closest('.gw');
    if(g){
      e.stopPropagation();
      const tip=ensureTip();
      if(tip.classList.contains('show') && tip.textContent===g.dataset.tip) hideTip();
      else { clearTimeout(timer); showTip(g); }
      return;
    }
    hideTip();
  });
})();
</script>
</body>
</html>
